defaults:
  - _self_
  - data: torch_cifar
  - model: torch_cifar
  - attack: default
  - files: cifar
  - score: default
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe
device_id: ${oc.env:DECKARD_DEVICE,cpu}
stage: ???
experiment_name: bit_depth_torch_cifar10
direction:
  - maximize
  - minimize
  - minimize
  - minimize
optimizers:
  - accuracy
  - train_time
  - adv_accuracy
  - adv_fit_time
hydra:
  run:
    dir: output/logs/${experiment_name}
  sweep:
    dir: output/logs/${device_id}
    subdir: ${hydra.sweeper.study_name}/${hydra.job.num}
  sweeper:
    study_name: ${stage}_FSQ
    sampler:
      _target_: optuna.samplers.TPESampler
      consider_prior: true
      prior_weight: 1.0
      consider_magic_clip: true
      consider_endpoints: false
      n_startup_trials: 10 # default: 10
      n_ei_candidates: 24 # default: 24
      multivariate: true
      warn_independent_sampling: true
    n_trials: 1000
    n_jobs: 1
    params:
      ++data.sampler.random_state: int(range(0, 10))
      ++model.fit_params.nb_epochs: int(interval(1, 50))
      ++model.fit_params.batch_size: int(interval(1, 10000))
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: ${direction}
