vars:
  - config/knn.yaml:hydra
  - config/plots.yaml:line_plot
  - config/plots.yaml:cat_plot
  # - config/condensed_plots.yaml:line_plot
  # - config/clean.yaml:params
  - config/clean.yaml:fillna
  - config/clean.yaml:replace
stages:
  ##############################################################################
  # These stages use the dvc API to run a single experiment at a time using a
  # deckard.Experiment object. This parses this file, saves the default hydra configuration
  # to params.yaml, and then runs the experiment with the given parameters.
  # This can be used to define a stage that runs a single experiment, or a stage for the
  # optimisation using the optimise.py script and the hydrasweeper API. This API is primarily used for
  # development and testing, as it is easier to run a single experiment at a time and debug it using
  # DVC's git-like features to track changes and minimise run time. 

  # This stage will parse the conf/knn.yaml file and save it to params.yaml
  # In addition, it will define a schema stage that will will 
  # 1. Determine the file paths for the data and model files (if specified)
  # 2. Run the experiment with the given parameters
  # 3. Save the results to the configured file paths (score and params files)
  # 4. Save a 'params.yaml' file with the scores (Always)
  # 5. Save the predictions to the given file paths (if specified)
  # 6. Save the probabilities to the given file paths (if specified)
  # 7. Save the (final) losses to the given file paths (if specified)
  # 8. Save the train/test labels to the given file paths (if specified)

  # You can arbitrarily define parameters in the 'conf' folder.
  # To parse the parameters, you can use the 'hydra' API to define a schema for the parameters
  # Or run `deckard.layers.parse` to parse the parameters and save them to a file.  
  ##############################################################################

  
  ##############################################################################
  install dependencies:
    cmd: >-
      pip install imbalanced-learn brotli zstd Levenshtein &&
      python -c "import imblearn, brotli, Levenshtein, importlib.metadata as md; open('requirements.txt', 'w', encoding='utf-8').write(f'imbalanced-learn=={imblearn.__version__}\\nbrotli=={brotli.__version__}\\nzstd=={md.version(\"zstd\")}\\nLevenshtein=={Levenshtein.__version__}\\n')"
    outs:
      - requirements.txt:
          cache: false
          persist: true

  ##############################################################################
  data:
    cmd: python data_prep.py
    deps:
      - data_prep.py
      - requirements.txt
    outs:
      - raw_data/:
          cache: true
          persist: true
          push: true

  ##############################################################################
  grid_search_precompute:
    matrix: 
      train_size: [1000] 
      dataset: [ddos, kdd_nsl, sms_spam, truthseeker]
      metric : [gzip, bz2, brotli, levenshtein, ratio, hamming]
      algorithm : # zero-hack, sort-hack, average-hack, alias
        - [False, False, False, "Vanilla"]
        - [False, True, False, "Assumed"]
        - [True, True, False, "Enforced"]
        - [True, False, True, "Average"]
    cmd: >-
      deckard optimize
      algorithm="${item.algorithm[3]}"
      data=${item.dataset}
      ++data.sampler.train_size=${item.train_size}
      ++data.random_state=42
      ++data.split=0
      ++data.pre_sample_transform=true
      optimization=precompute
      metric_name=${item.metric}
      fold_name=full
      ++data.pipeline.distance.metric=${item.metric}
      ++data.pipeline.distance.zero_hack=${item.algorithm[0]}
      ++data.pipeline.distance.sort_hack=${item.algorithm[1]}
      ++data.pipeline.distance.average_hack=${item.algorithm[2]}
      ++data.pipeline.distance.distance_matrix_full=output/${item.dataset}/distance_matrix/${item.metric}/${item.algorithm[3]}/full.npz
      files=precompute
      hydra.sweeper.n_trials=1
      --config-dir config
      --config-name default
    deps:
      - config/default.yaml
      - config/data/default.yaml
      - config/data/precompute.yaml
      - config/model/ncd_knn.yaml
      - raw_data/
    outs:
      - output/${item.dataset}/distance_matrix/${item.metric}/${item.algorithm[3]}/full.npz:
            cache: false
            persist: true
            push: true
      - output/logs/precompute_${item.dataset}_knn_${item.algorithm[3]}_${item.metric}_${item.train_size}_full/:
            cache: false
            persist: false
    params:
      - config/default.yaml:
          - hydra
  ##############################################################################
  grid_search:
    matrix: 
      train_size: [1000] # 10, 20, 35, 60, 100, 200, 500  200, 500
      dataset: [ddos, kdd_nsl, sms_spam, truthseeker] 
      metric : [gzip, bz2, brotli, levenshtein, ratio, hamming]
      model_name : [knn,logistic, svc] # knn, svc, logistic
      algorithm : # zero-hack, sort-hack, average-hack, alias
        - [False, False, False, "Vanilla"]
        - [False, True, False, "Assumed"] 
        - [True, True, False, "Enforced"]
        - [True, False, True, "Average"]
    cmd: >-
      deckard optimize
      algorithm="${item.algorithm[3]}"
      data=${item.dataset}
      model=ncd_${item.model_name}
      data.sample.name=deckard.data.sample.KFoldSampler
      ++data.sampler.train_size=${item.train_size}
      ++data.random_state=42
      optimization=search
      metric_name=${item.metric}
      ++data.pipeline.distance.metric=${item.metric}
      ++data.pipeline.distance.zero_hack=${item.algorithm[0]}
      ++data.pipeline.distance.sort_hack=${item.algorithm[1]}
      ++data.pipeline.distance.average_hack=${item.algorithm[2]}
      ++data.pipeline.distance.distance_matrix_full=output/${item.dataset}/distance_matrix/${item.metric}/${item.algorithm[3]}/full.npz
      hydra.sweeper.n_jobs=1
      hydra.sweeper.n_trials=1
      hydra.sweeper.params.data.split=int(range(0,5))
      hydra.launcher.n_jobs=1
      ++data.pipeline=${item.model_name}
      --config-dir config
      --config-name default
      --multirun
    deps:
      - config/default.yaml
      - config/data/default.yaml
      - config/data/${item.model_name}.yaml
      - config/model/ncd_${item.model_name}.yaml
      - config/search/models/${item.model_name}.yaml
      - raw_data/
      - output/${item.dataset}/distance_matrix/${item.metric}/${item.algorithm[3]}/full.npz
    outs:
      - output/logs/search_${item.dataset}_${item.model_name}_${item.algorithm[3]}_${item.metric}_${item.train_size}_all/:
            cache: false
            persist: false
      - output/${item.dataset}/reports/search/${item.model_name}/${item.algorithm[3]}/${item.train_size}/${item.metric}/:
            cache: false
            persist: true
    params:
      - config/default.yaml:
          - hydra

  #############################################################################
  find_best:
    matrix:
      dataset : [ddos, kdd_nsl, sms_spam, truthseeker]
      algorithm : [Vanilla, Assumed, Enforced, Average]
      model : [knn, svc, logistic]
      metric : [gzip, bz2, brotli, levenshtein, ratio, hamming]
    deps:
      - output/${item.dataset}/reports/search/${item.model}/${item.algorithm}/1000/${item.metric}/
      - config/model/ncd_${item.model}.yaml
      - config/${item.model}.yaml
      - find_best.py
    cmd: >-
      python find_best.py
      -n ${item.dataset}_${item.model}_${item.algorithm}
      -p sqlite:///output/optuna.db
      -d config/model/ncd_${item.model}.yaml
      -c config/${item.model}.yaml
      -s data.pipeline.distance.metric=${item.metric}
      -o best/${item.dataset}_${item.model}_${item.algorithm}_${item.metric}.yaml
      -x data.pipeline.distance.distance_matrix_full data.split files.directory
    outs:
      - best/${item.dataset}_${item.model}_${item.algorithm}_${item.metric}.yaml
  ##############################################################################
  refit_best:
    matrix:
      train_size: [10, 20, 35, 60, 100, 200, 500, 1000] 
      dataset: [ddos, kdd_nsl, sms_spam, truthseeker]
      algorithm : [Vanilla, Assumed, Enforced, Average]
      model : [knn, svc, logistic]
      metric : [gzip, bz2, brotli, levenshtein, ratio, hamming]
    deps:
      - output/${item.dataset}/reports/search/${item.model}/${item.algorithm}/
      - best/${item.dataset}_${item.model}_${item.algorithm}_${item.metric}.yaml
    cmd: >-
      deckard optimize
      algorithm="${item.algorithm}"
      data=${item.dataset}
      model=ncd_${item.model}
      ++data.sampler.train_size=${item.train_size}
      ++data.split=-1
      ++files.directory=output/${item.dataset}
      hydra.run.dir=output/${item.dataset}/logs/refit/${item.model}/${item.algorithm}/${item.metric}/${item.train_size}/
      --config-name ${item.dataset}_${item.model}_${item.algorithm}_${item.metric}
      --config-dir best
    outs:
      - output/${item.dataset}/reports/refit/${item.model}/${item.algorithm}/${item.metric}/${item.train_size}/
      - output/${item.dataset}/logs/refit/${item.model}/${item.algorithm}/${item.metric}/${item.train_size}/

  compile_results:
    cmd: >-
      python -m deckard.layers.compile_results
      --output_file output/combined/search_results.csv
      --optuna_db sqlite:///output/optuna.db
    deps:
      - output/optuna.db
      - best/
      - output/ddos/reports/refit/
      - output/kdd_nsl/reports/refit/
      - output/sms_spam/reports/refit/
      - output/truthseeker/reports/refit/
      - ../../deckard
      - config/default.yaml
    outs:
      - output/combined/search_results.csv

  plot_results:
    cmd: python plots.py
    deps:
      - plots.py
      - output/combined/search_results.csv
      - output/combined/plots/search_merged.csv
      - output/combined/plots/precomputed_merged.csv
      - output/combined/plots/refit_merged.csv
      - output/ddos/reports/refit/
      - output/kdd_nsl/reports/refit/
      - output/sms_spam/reports/refit/
      - output/truthseeker/reports/refit/
    outs:
      - output/combined/plots/search_averaged.csv
      - output/combined/plots/accuracy_vs_algorithm.pdf
      - output/combined/plots/accuracy_vs_kernel.pdf
      - output/combined/plots/distance_matrix_time_vs_algorithm.pdf
      - output/combined/plots/train_time_vs_algorithm.pdf
      - output/combined/plots/pred_time_vs_algorithm.pdf
  
