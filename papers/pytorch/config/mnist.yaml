defaults:
  - _self_
  - data: torch_mnist
  - model: torch_mnist
  - attack: default
  - files: mnist
  - score: default
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: grid
  - override hydra/launcher: joblib
def_name: control
atk_name: hsj
dataset: mnist
model_name: ResNet18
device_id: gpu
stage: ???
direction:
  -  "maximize"
optimizers:
  - accuracy
hydra:
  run:
    dir: ${files.directory}/logs/${stage}/
  sweep:
    dir: ${files.directory}/logs/${stage}/${model_name}/${atk_name}/${model.fit_params.nb_epochs}/
    subdir: ${def_name}/${hydra.job.num}
  sweeper:
    sampler:
      _target_: optuna.samplers.GridSampler
    direction: ${direction}
    study_name: ${dataset}_${model_name}_${def_name}_${atk_name}
    storage: sqlite:///optuna.db
    n_jobs: ${oc.env:HYDRA_SWEEPER_N_JOBS, 32}
    n_trials: ${oc.env:HYDRA_SWEEPER_N_TRIALS, 128}
    max_failure_rate: 1.0
    params:
      ++model.fit_params.nb_epochs: choice(1, 10, 30, 50, 100)
      ++model.fit_params.batch_size: choice(128, 256, 512, 1024)
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
  launcher:
    _target_: hydra_plugins.hydra_joblib_launcher.joblib_launcher.JoblibLauncher
    n_jobs: ${oc.env:HYDRA_SWEEPER_N_JOBS, 8}
    prefer : threads
    verbose: 10
    timeout: null
    pre_dispatch: n_jobs
    batch_size: auto
    temp_folder: /tmp/deckard
    max_nbytes: 100000
    mmap_mode: r
