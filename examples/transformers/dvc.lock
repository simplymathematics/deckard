        alias: hf_distilbert_sst2_tuned
        classifier: true
        clip_values:
        - 0
        - 1
        criterion: CrossEntropyLoss
        defaults:
        - _self_
        - defense:
        fit_params:
          nb_epochs: 0
          batch_size: 16
          verbose: false
        library: pytorch
        model_params:
          model_name: distilbert/distilbert-base-uncased-finetuned-sst-2-english
          model_revision: main
          pretrained: true
          num_classes: 2
          return_features: false
        name: 
          deckard.frameworks.transformers.declarations.PretrainedSequenceClassificationTransformer
        optimizer:
          name: SGD
          lr: 0.01
          momentum: 0.9
    outs:
    - path: output/attacks/transformers_textattack_sst2_tuned.pkl
      hash: md5
      md5: 47c23189cfa99551980cf851418a4258
      size: 8270
    - path: output/models/transformers_textattack_sst2_tuned.pkl
      hash: md5
      md5: 827f6c0244f27890ce5a4e62116d4a96
      size: 267863381
    - path: output/scores/transformers_textattack_sst2_tuned.json
      hash: md5
      md5: d0a31d005916c2431b0df3bf258fbf38
      size: 12678
