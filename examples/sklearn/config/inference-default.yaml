# data_alias: ${data.alias}
# model_alias: ${model.alias}
# attack_alias: ${attack.alias}
# defense_alias: ${defense.alias}
defaults:
    - _self_
    - data: adult
    - model: rf
    - defense: feature-squeezing
    - attack: membership
    - score: classification
    - files: null
    - search/models: ${model}
    - search/defenses: ${defense}
    - search/attacks: ${attack}
    - override hydra/sweeper : optuna
    - override hydra/sweeper/sampler : random
experiment_name: ${hash:${stage_params:${oc.select:stage,???}}}
directions:
- maximize
- minimize
- minimize
optimizers:
- accuracy
- membership_inference_accuracy
- attack_generation_time
report_trial_attrs: true
pruning_enabled: false
hydra:
  run:
    dir: outputs/logs/${experiment_name}
  sweep:
    dir: outputs/logs/
    subdir: ${hydra.sweeper.study_name}/${hydra.job.num}
  sweeper:
    study_name: evasion_attack
    storage: sqlite:///optuna.db
    direction: ${directions}
    max_failure_rate: 1.0
    sampler:
      _target_: optuna.samplers.RandomSampler
      seed: 42
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    n_trials: 100
    n_jobs: 1
  callbacks:
    deckard_optuna:
      # DefaultOptimizerCallback is a Hydra callback used by both single-run and
      # --multirun executions.
      #
      # Single-run mode (no --multirun):
      #   - Hydra's Optuna sweeper is not active.
      #   - No Optuna study/trials are created by this callback.
      #   - The callback still composes run files (e.g. params/score paths).
      #
      # Multirun mode (--multirun):
      #   - Hydra's Optuna sweeper is active.
      #   - study_name/storage are read from hydra.sweeper at runtime and used to
      #     create/load the Optuna study.
      #
      # study_name and storage are intentionally omitted from this callback block;
      # they can still be passed explicitly to the constructor for programmatic use.
      #
      # directions and optimizers drive both study creation and metric naming:
      #   - directions: per-metric optimization direction ("minimize" or "maximize");
      #     "diff" is treated as a non-directional delta metric and excluded from
      #     the Optuna metric names list.
      #   - optimizers: metric names corresponding to each direction.
      #
      # File paths (directory, log_file, params_file, error_file, score_file) are
      # also optional; when omitted they are resolved from hydra.sweep.dir/subdir
      # and hydra.job.name at on_compose_config time.
      _target_: deckard.layers.optimize.DefaultOptimizerCallback
      
