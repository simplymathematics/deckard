defaults:
  - _self_
  - data: lung
  - model: weibull
  - score: survival

plots_folder: plots/survival
# SurvivalExperimentConfig required fields:
# - data (from defaults)
# - model (from defaults)
# - target
# - event_col
# - duration_col
target: E
# Required by SurvivalExperimentConfig; event/censoring indicator column.
event_col: E
# Required by SurvivalExperimentConfig; event duration/time column.
duration_col: T
dataset: ${data.alias}
calculate_attack_failures: false

covariates:
  - T
  - E

plot:
  summary_plot: ${model.alias}_summary_plot.pdf
  summary_file: ${model.alias}_summary.csv
  plot: ${model.alias}_aft.pdf
  qq_file: ${model.alias}_qq.pdf

labels:
  xlabel: log(theta)
  ylabel: ''

survival_model_params:
  # Passed to the selected lifelines fitter constructor.
  penalizer: 0.01

t0: 10.0
