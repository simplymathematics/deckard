scorers:
  accuracy:
    score_function: sklearn.metrics.accuracy_score
  precision:
    score_function: sklearn.metrics.precision_score
    score_params:
      average: weighted
      zero_division: 0
  recall:
    score_function: sklearn.metrics.recall_score
    score_params:
      average: weighted
      zero_division: 0
  f1:
    score_function: sklearn.metrics.f1_score
    score_params:
      average: weighted
      zero_division: 0
  demographic_parity_difference:
    score_function: deckard.score.fairness_demographic_parity_difference
  equalized_odds_difference:
    score_function: deckard.score.fairness_equalized_odds_difference
