name: sklearn.adult
data_params:
  repo_dataset_path: ../../raw_data/adult_income/adult_income_dataset.csv
sampler:
  name: deckard.data.sample.SplitSampler
  test_size: 0.2
  random_state: 42
  stratify: false
classifier: true
alias: ${.name}
pipeline:
  imputer:
    name: sklearn.impute.SimpleImputer
    strategy: mean
    dtype: numeric
  encoder:
    name: sklearn.preprocessing.OrdinalEncoder
    dtype: string
