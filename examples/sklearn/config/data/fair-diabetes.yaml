dataset_name: diabetes
_target_: deckard.plugins.fairlearn.FairlearnDataConfig
classifier: false
alias: fair-diabetes
sensitive_columns:
- sex
pipeline:
  imputer:
    name: sklearn.impute.SimpleImputer
    strategy: mean
sampler:
  name: deckard.data.sample.SplitSampler
  test_size: 0.2
  random_state: 42
  stratify: false
