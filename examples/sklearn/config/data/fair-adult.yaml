name: sklearn.adult
_target_: deckard.plugins.fairlearn.FairlearnDataConfig
classifier: true
alias: fair-adult-fairlearn
sensitive_columns:
- sex
fairness_defense:
  step_name: fairness_correlation_remover
  name: fairlearn.preprocessing.CorrelationRemover
pipeline:
  imputer:
    name: sklearn.impute.SimpleImputer
    strategy: mean
sampler:
  name: deckard.data.sample.SplitSampler
  test_size: 0.2
  random_state: 42
  stratify: false
