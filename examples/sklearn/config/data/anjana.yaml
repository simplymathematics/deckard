name: https://raw.githubusercontent.com/simplymathematics/Adult-Census-Income/refs/heads/master/adult.csv
target: income
classifier: true
alias: ${.name}
_target_: deckard.plugins.anjana.AnjanaDataConfig
sampler:
  name: deckard.data.sample.SplitSampler
  test_size: 0.2
  random_state: 42
  stratify: false
anjana_defense:
  name: anjana.anonymity.k_anonymity
  k: 2
quasi_identifiers:
- age
sensitive_attribute: target
sensitive_columns:
- sex
pipeline:
  imputer:
    name: sklearn.impute.SimpleImputer
    strategy: mean
    dtype: numeric
  encoder:
    name: sklearn.preprocessing.OneHotEncoder
    handle_unknown : ignore
    sparse_output : False
    dtype: string
  label_encoder:
    name: sklearn.preprocessing.LabelEncoder
    fit_y : True
    fit_X : False
