dataset_name: https://gist.githubusercontent.com/simplymathematics/8c6c04bd151950d5ea9e62825db97fdd/raw/34e546e4813f154d11d4f13869b9e3481fc3e829/truthseeker.csv
target: BotScoreBinary
keep:
- tweet
alias: truthseeker
pipeline:
  string_embedding:
    name: sklearn.feature_extraction.text.TfidfVectorizer
    max_features: 100
    stop_words: english
sampler:
  name: deckard.data.sample.SplitSampler
  test_size: 0.2
  random_state: 0
  stratify: true
