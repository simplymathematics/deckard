schema: '2.0'
stages:
  set_config_paths:
    cmd: "echo \"export DECKARD_CONFIG_DIR=./config\" > .deckard_rc && echo \"export
      DECKARD_DEFAULT_CONFIG_FILE=default.yaml\" >> .deckard_rc && source .deckard_rc\n"
    deps:
    - path: ./config/default.yaml
      hash: md5
      md5: 002bf6827b00f3b03f86171069e122f9
      size: 1341
    params:
      config/default.yaml:
        attack_alias: ${attack.alias}
        data_alias: ${data.alias}
        defaults:
        - _self_
        - data: adult
        - model: rf
        - defense: class-labels
        - attack: hsj
        - score: classification
        - search/models: ${model}
        - search/defenses: ${defense}
        - search/attacks: ${attack}
        - files:
        - override hydra/sweeper: optuna
        - override hydra/sweeper/sampler: random
        defense_alias: ${defense.alias}
        directions:
        - maximize
        - maximize
        - maximize
        experiment_name: ${hash:${data},${model},${attack}}
        hydra:
          run:
            dir: outputs/logs/${experiment_name}
          sweep:
            dir: outputs/logs/
            subdir: ${hydra.sweeper.study_name}/${hydra.job.num}
          sweeper:
            study_name: 
              ${data_alias}_${model_alias}_${defense_alias}_${attack_alias}
            storage: sqlite:///optuna.db
            direction: ${directions}
            max_failure_rate: 1.0
            sampler:
              _target_: optuna.samplers.RandomSampler
              seed: 42
            _target_: 
              hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
            n_trials: 100
            n_jobs: 1
          callbacks:
            deckard_optuna:
              _target_: deckard.layers.optimize.DefaultOptimizerCallback
              storage: ${hydra.sweeper.storage}
              study_name: ${hydra.sweeper.study_name}
              directions: ${directions}
              optimizers: ${optimizers}
        model_alias: ${model.alias}
        optimizers:
        - accuracy
        - evasion_accuracy
        - attack_generation_time
    outs:
    - path: .deckard_rc
      hash: md5
      md5: 19021154ecc61513bd7a0f05b88e1a95
      size: 83
  simple_example:
    cmd: deckard optimize experiment_name=default
    deps:
    - path: ../../deckard
      hash: md5
      md5: a32b335ce985f3314074fe830750b4ea.dir
      size: 1596647
      nfiles: 132
    - path: ./config/default.yaml
      hash: md5
      md5: 002bf6827b00f3b03f86171069e122f9
      size: 1341
    - path: .deckard_rc
      hash: md5
      md5: 19021154ecc61513bd7a0f05b88e1a95
      size: 83
