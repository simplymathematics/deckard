    deps:
    - scoring.ipynb
    - ../../deckard/score/
    - ../../deckard/artifacts.py
    - ../../deckard/file.py
    - ../../deckard/utils.py
    # No outs/metrics: scoring.ipynb demonstrates in-memory score contract behavior

  notebook_dvc:
    cmd: jupyter nbconvert --to notebook --execute --inplace dvc.ipynb
    deps:
    - dvc.ipynb
