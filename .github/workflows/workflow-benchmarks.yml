name: Workflow Benchmarks

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate workflow timing benchmark
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflows = [
              'deckard-test.yml',
              'test-optional-dependencies.yml',
              'platform-build.yml',
              'docker-test.yml',
              'compile-docs.yml',
              'security-scan.yml'
            ];
            let lines = ['# Workflow Benchmark Report', '', `Generated: ${new Date().toISOString()}`, ''];
            lines.push('| Workflow | Last Conclusion | Last Duration (min) |');
            lines.push('|---|---|---|');
            for (const wf of workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: wf,
                per_page: 1
              }).catch(() => ({ data: { workflow_runs: [] } }));
              const run = runs.data.workflow_runs[0];
              if (!run) {
                lines.push(`| ${wf} | n/a | n/a |`);
                continue;
              }
              const started = new Date(run.run_started_at).getTime();
              const updated = new Date(run.updated_at).getTime();
              const durationMin = ((updated - started) / 60000).toFixed(2);
              lines.push(`| ${wf} | ${run.conclusion || 'in_progress'} | ${durationMin} |`);
            }
            require('fs').writeFileSync('workflow-benchmarks.md', lines.join('\n'));

      - name: Upload benchmark report
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: workflow-benchmarks
          path: workflow-benchmarks.md
          retention-days: 30
