name: Security Scan

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sast-and-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/security-baseline.txt "setuptools>=78.1.1" wheel
          python -m pip install -c constraints/security-baseline.txt .[test]
          python -m pip install -c constraints/security-baseline.txt bandit pip-audit

      - name: Run Bandit SAST
        run: |
          # B324 is intentionally excluded: this codebase uses MD5 for stable
          # non-cryptographic identifiers/cache keys, not for security checks.
          # B301/B614 findings are tracked as trust-boundary notes because
          # loading artifacts is user-controlled and depends on source trust.
          bandit -r deckard -s B324 -f json -o bandit-report.json
          bandit -r deckard -s B324 -f txt

      - name: Run dependency vulnerability audit
        run: |
          pip-audit -r <(python -m pip freeze) -f json -o pip-audit-report.json

      - name: Upload security reports
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30
