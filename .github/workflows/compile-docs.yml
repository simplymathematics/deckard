name: "Push Docs Check"
on:
  push:
    branches:
      - main
      - refactor-squashed
  workflow_dispatch:
    inputs:
      force_repro:
        description: "Force DVC repro even when stages are unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DVC_REPRO_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_repro && '--force' || '' }}
      HF_HOME: ~/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: ~/.cache/huggingface/hub
      TRANSFORMERS_CACHE: ~/.cache/huggingface/transformers
      HF_DATASETS_CACHE: ~/.cache/huggingface/datasets
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Cache DVC artifacts and notebooks
      uses: actions/cache@v4
      with:
        path: |
          docs/notebooks/build/
          docs/notebooks/.dvc/cache/
          ~/.cache/huggingface/
          ~/.cache/huggingface/hub/
          ~/.cache/huggingface/transformers/
          ~/.cache/huggingface/datasets/
        # Invalidate cache whenever notebook stage lockfile changes.
        key: dvc-cache-${{ runner.os }}-${{ hashFiles('docs/notebooks/dvc.lock') }}
    - name : install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install docs + required notebook stacks, then pin anjana/pycanon to
        # versions compatible with the current Sphinx/docutils toolchain.
        pip install --no-cache-dir '.[lifelines,fairlearn,seaborn,yellowbrick,docs,datasets]'
        pip install --no-cache-dir 'docutils==0.21.2' 'pycanon==1.0.3' 'anjana==1.1.0'
        pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.4.1' 'torchvision==0.19.1' 'torchaudio==2.4.1'
    - name : build docs
      run: |
        cd docs
        make html DVC_REPRO_ARGS="${DVC_REPRO_ARGS}"
    - name: Push DVC cache
      run: |
        cd docs/notebooks
        dvc push || echo "DVC push: remote not configured; artifacts managed via GitHub Actions cache"
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build/html

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
