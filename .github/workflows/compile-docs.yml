name: "Push Docs Check"
on:
  push:
    branches:
      - main
      - refactor-squashed
  workflow_dispatch:
    inputs:
      cache_flush_token:
        description: "Optional cache namespace override to force a clean docs/DVC cache (e.g. 2026-05-major-refactor)"
        required: false
        default: "stable"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Bump this from workflow_dispatch to force a fresh cache lineage after major updates.
      CACHE_FLUSH_TOKEN: ${{ github.event.inputs.cache_flush_token || 'stable' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Cache DVC artifacts and notebooks
      uses: actions/cache@v4
      with:
        path: |
          docs/notebooks/build/
          .dvc/cache/
        key: dvc-cache-${{ runner.os }}-${{ env.CACHE_FLUSH_TOKEN }}-${{ hashFiles('docs/notebooks/dvc.lock', 'dvc.lock', 'pyproject.toml') }}
        restore-keys: |
          dvc-cache-${{ runner.os }}-${{ env.CACHE_FLUSH_TOKEN }}-
    - name : install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[lifelines,anjana,fairlearn,seaborn,yellowbrick,docs,datasets]'
        pip install --index-url https://download.pytorch.org/whl/cpu --force-reinstall torch torchvision torchaudio
    - name: Pull DVC cache
      run: |
        cd docs/notebooks
        dvc pull || echo "DVC pull: no remote or cache empty; using what's available locally"
    - name : build docs
      run: |
        cd docs
        make html DVC_REPRO_ARGS=--force
    - name: Push DVC cache
      run: |
        cd docs/notebooks
        dvc push || echo "DVC push: remote not configured; artifacts managed via GitHub Actions cache"
    - name: commit changes
      uses : stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: Update docs
        branch: refactor-squashed
        file_pattern: docs/notebooks/*.ipynb docs/notebooks/dvc.lock
        commit_options: '--no-verify --signoff'
        repository: .
        commit_user_name: github-actions
        commit_user_email: github-actions@users.noreply.github.com
        commit_author: github-actions <github-actions@users.noreply.github.com>
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build/html

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
