name: "Push Docs Check"
on:
  push:
    branches:
      - main
      - refactor-squashed
  workflow_dispatch:
    inputs:
      force_repro:
        description: "Force DVC repro even when stages are unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DVC_REPRO_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.force_repro && '--force' || '' }}
      HF_HOME: ~/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: ~/.cache/huggingface/hub
      TRANSFORMERS_CACHE: ~/.cache/huggingface/transformers
      HF_DATASETS_CACHE: ~/.cache/huggingface/datasets
    steps:
    - uses: actions/checkout@v4
    - name: Disk usage before cleanup
      run: |
        echo "Disk usage before cleanup:"
        df -h
    - name: Free disk space on runner
      run: |
        # Remove large preinstalled SDKs we do not use in docs builds.
        sudo rm -rf /usr/share/dotnet || true
        sudo rm -rf /usr/local/lib/android || true
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /opt/hostedtoolcache/CodeQL || true
    - name: Disk usage after cleanup
      run: |
        echo "Disk usage after cleanup:"
        df -h
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Cache DVC artifacts
      uses: actions/cache@v4
      with:
        path: |
          docs/notebooks/.dvc/cache/
        key: dvc-cache-${{ runner.os }}-${{ hashFiles('.github/workflows/compile-docs.yml', 'docs/Makefile', 'docs/notebooks/dvc.lock', 'docs/notebooks/dvc.yaml', 'pyproject.toml') }}
        restore-keys: |
          dvc-cache-${{ runner.os }}-
    - name : install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install docs + required notebook stacks, then pin anjana/pycanon to
        # versions compatible with the current Sphinx/docutils toolchain.
        pip install --no-cache-dir '.[lifelines,fairlearn,seaborn,yellowbrick,docs,datasets]'
        pip install --no-cache-dir 'docutils==0.21.2' 'pycanon==1.0.3' 'anjana==1.1.0'
        pip install --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.4.1' 'torchvision==0.19.1' 'torchaudio==2.4.1'
    - name: Pull DVC cache
      run: |
        cd docs/notebooks
        dvc pull || echo "DVC pull: no remote or cache empty; using what's available locally"
    - name : build docs
      run: |
        cd docs
        make html DVC_REPRO_ARGS="${DVC_REPRO_ARGS}"
    - name: Push DVC cache
      run: |
        cd docs/notebooks
        dvc push || echo "DVC push: remote not configured; artifacts managed via GitHub Actions cache"
    - name: commit changes
      uses : stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: Update docs
        branch: refactor-squashed
        file_pattern: docs/notebooks/*.ipynb docs/notebooks/dvc.lock
        commit_options: '--no-verify --signoff'
        repository: .
        commit_user_name: github-actions
        commit_user_email: github-actions@users.noreply.github.com
        commit_author: github-actions <github-actions@users.noreply.github.com>
    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/build/html

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
