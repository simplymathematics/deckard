name: "Push Docs Check"
on:
  push:
    branches:
      - refactor-squashed

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: refactor-squashed
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    - name: Cache DVC artifacts and notebooks
      uses: actions/cache@v4
      with:
        path: |
          docs/notebooks/build/
          .dvc/cache/
        key: dvc-cache-${{ hashFiles('docs/notebooks/dvc.lock', 'dvc.lock') }}
        restore-keys: |
          dvc-cache-
    - name : install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[lifelines,anjana,fairlearn,seaborn,yellowbrick,docs,datasets]'
        pip install --index-url https://download.pytorch.org/whl/cpu --force-reinstall torch torchvision torchaudio
    - name: Pull DVC cache
      run: |
        cd docs/notebooks
        dvc pull || echo "DVC pull not available; will proceed with cached objects from GitHub Actions"
    - name : build docs
      run: |
        cd docs
        make html
    - name: Push DVC cache
      run: |
        cd docs/notebooks
        dvc push || echo "DVC push not available; cache will be saved via GitHub Actions"
    - name: commit changes
      uses : stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: Update docs
        branch: refactor-squashed
        file_pattern: docs/build/html/** docs/notebooks/*.ipynb docs/notebooks/dvc.lock
        commit_options: '--no-verify --signoff'
        repository: .
        commit_user_name: github-actions
        commit_user_email: github-actions@users.noreply.github.com
        commit_author: github-actions
