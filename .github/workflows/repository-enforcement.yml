name: Repository Enforcement

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Run structural enforcement checks
        run: |
          python scripts/repository_enforcement.py --scope deckard/ --enforce-runtime-init-params --enforce-field-metadata --enforce-runtime-repr --enforce-target-field
          python scripts/repository_enforcement.py --scope deckard/ --require-attributes-sections --enforce-runtime-init-params --enforce-field-metadata --enforce-runtime-repr --enforce-target-field

     
