name: Repository Enforcement

on:
  pull_request:
    branches: [main, refactor-squashed]
  push:
    branches: [main, refactor-squashed]

permissions:
  contents: read

jobs:
  enforcement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]

      - name: Run structural enforcement checks
        run: |
          python scripts/repository_enforcement.py --scope deckard/plugins
          python scripts/repository_enforcement.py --scope deckard/frameworks

      - name: Run enforcement-focused tests
        run: |
          pytest -q test/test_package/test_repository_wide_enforcement.py

      - name: Run strict docs/types enforcement report (non-blocking)
        continue-on-error: true
        run: |
          python scripts/repository_enforcement.py --scope deckard/plugins --strict-docs-types
          python scripts/repository_enforcement.py --scope deckard/frameworks --strict-docs-types
