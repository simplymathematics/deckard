name: Test Released Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  base-release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download released wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist
          mkdir -p dist
          gh release download "${{ github.event.release.tag_name }}" --pattern "*.whl" --dir dist

      - name: Install released wheel with base test deps
        run: |
          python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl | head -n1)
          python -m pip install "${WHEEL}[test]"

      - name: Run base dependency tests
        run: |
          python -m pytest test \
            --ignore test/test_data/test_pytorch.py \
            --ignore test/test_layers/test_survival.py \
            --ignore test/test_data/test_data_fairness.py \
            --ignore test/test_data/test_fairness.py \
            --ignore test/test_model/test_model_fairness.py \
            --ignore test/test_plot/test_seaborn.py \
            --ignore test/test_plot/test_yellowbrick.py \
            --ignore test/test_plot/test_init.py

  torch-release-tests:
    uses: ./.github/workflows/optional-dependency-test-reusable.yml
    with:
      workflow_name: torch-release
      extra: torch
      tests: test/test_data/test_pytorch.py test/test_attack/test_attack.py
      package_source: release
      release_tag: ${{ github.event.release.tag_name }}

  lifelines-release-tests:
    uses: ./.github/workflows/optional-dependency-test-reusable.yml
    with:
      workflow_name: lifelines-release
      extra: lifelines
      tests: test/test_layers/test_survival.py test/test_data/test_data.py -k lifelines
      package_source: release
      release_tag: ${{ github.event.release.tag_name }}

  fairlearn-release-tests:
    uses: ./.github/workflows/optional-dependency-test-reusable.yml
    with:
      workflow_name: fairlearn-release
      extra: fairlearn
      tests: test/test_data/test_data_fairness.py test/test_data/test_fairness.py test/test_model/test_model_fairness.py
      package_source: release
      release_tag: ${{ github.event.release.tag_name }}

  seaborn-release-tests:
    uses: ./.github/workflows/optional-dependency-test-reusable.yml
    with:
      workflow_name: seaborn-release
      extra: seaborn
      tests: test/test_plot/test_seaborn.py
      package_source: release
      release_tag: ${{ github.event.release.tag_name }}

  yellowbrick-release-tests:
    uses: ./.github/workflows/optional-dependency-test-reusable.yml
    with:
      workflow_name: yellowbrick-release
      extra: seaborn,yellowbrick
      tests: test/test_plot/test_yellowbrick.py test/test_plot/test_init.py
      package_source: release
      release_tag: ${{ github.event.release.tag_name }}
