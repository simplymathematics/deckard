name: Docs Coverage Gate

on:
  pull_request:
    branches: [ main ]
    paths:
      - "docs/**"
      - "deckard/**"
      - "scripts/repository_enforcement.py"
      - "scripts/docs_coverage_gate.py"
      - "test/test_package/test_docs_coverage_gate.py"
      - "test/test_integration/test_docs_coverage_gate_integration.py"
      - ".github/workflows/docs-coverage-gate.yml"
  push:
    branches: [ main ]
    paths:
      - "docs/**"
      - "deckard/**"
      - "scripts/repository_enforcement.py"
      - "scripts/docs_coverage_gate.py"
      - "test/test_package/test_docs_coverage_gate.py"
      - "test/test_integration/test_docs_coverage_gate_integration.py"
      - ".github/workflows/docs-coverage-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[test]
          python -m pip install pytest-xdist

      - name: Compute and enforce docs coverage (>=95%)
        run: |
          python scripts/docs_coverage_gate.py \
            --docs-scope docs \
            --threshold 95 \
            --output-json build/quality_controller/docs_coverage_audit.json \
            --output-md build/quality_controller/docs_coverage_summary.md

      - name: Run docs coverage tests
        run: |
          pytest -n auto test/test_package/test_docs_coverage_gate.py test/test_integration/test_docs_coverage_gate_integration.py

      - name: Upload docs coverage artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: docs-coverage-reports
          path: |
            build/quality_controller/docs_coverage_audit.json
            build/quality_controller/docs_coverage_summary.md
          retention-days: 30
