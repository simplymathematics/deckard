#
name: Test Docker Images

# Configures this workflow to run every time a change is pushed to the branch called `release`.
on:
  pull_request:
    branches: [ main ]

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DECKARD_APT_MIRROR_PORTS: ${{ vars.DECKARD_APT_MIRROR_PORTS || '' }}
  DECKARD_APT_MIRROR_ARCHIVE: ${{ vars.DECKARD_APT_MIRROR_ARCHIVE || '' }}
  DECKARD_APT_HTTP_PROXY: ${{ vars.DECKARD_APT_HTTP_PROXY || '' }}
  DECKARD_APT_HTTPS_PROXY: ${{ vars.DECKARD_APT_HTTPS_PROXY || '' }}
  DECKARD_APT_NO_PROXY: ${{ vars.DECKARD_APT_NO_PROXY || '' }}

# There is a single job in this workflow. It's configured to run on the latest available version of Ubuntu.
jobs:
  build-and-test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - variant: cpu
            enable_cuda: "0"
            base_image: ubuntu:20.04
          - variant: mps
            enable_cuda: "0"
            base_image: ubuntu:20.04
          - variant: cuda
            enable_cuda: "1"
            base_image: nvidia/cuda:12.0.0-runtime-ubuntu20.04

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (${{ matrix.variant }})
        if: ${{ env.DECKARD_GPU_MODE == '' || env.DECKARD_GPU_MODE == 'auto' || env.DECKARD_GPU_MODE == matrix.variant }}
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          push: false
          build-args: |
            ENABLE_CUDA=${{ matrix.enable_cuda }}
            BASE_IMAGE=${{ matrix.base_image }}
            APT_MIRROR_PORTS=${{ env.DECKARD_APT_MIRROR_PORTS }}
            APT_MIRROR_ARCHIVE=${{ env.DECKARD_APT_MIRROR_ARCHIVE }}
            APT_HTTP_PROXY=${{ env.DECKARD_APT_HTTP_PROXY }}
            APT_HTTPS_PROXY=${{ env.DECKARD_APT_HTTPS_PROXY }}
            APT_NO_PROXY=${{ env.DECKARD_APT_NO_PROXY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.run_id }}-${{ matrix.variant }}
