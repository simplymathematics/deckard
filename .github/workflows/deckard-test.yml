name: Python application

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  base-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install .[test]
        python3 -m pip install pytest-cov pytest-xdist
    - name: Test base dependencies only
      run: |
        python3 -m pytest test \
          -n auto \
          --ignore test/test_plugins/ \
          --ignore test/test_frameworks/ \
          --cov=deckard \
          --cov-report=xml:coverage-base.xml \
          --cov-report=term-missing
    - name: Upload coverage artifact
      if: ${{ always() && env.ACT != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage-base
        path: coverage-base.xml
        retention-days: 30
    - name: Report job timing
      if: always()
      run: |
        echo "::notice::Job completed in $SECONDS seconds" > /tmp/timing.txt
        cat /tmp/timing.txt
