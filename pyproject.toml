[project]
name = "deckard"
version = "0.95.0"
description = "A tool for declarative AI experimentation, evaluation, and verification."
authors = [
    { name = "simplymathematics" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas",
    "scikit-learn",
    "hydra-core",
    "numpy",
    "adversarial-robustness-toolbox",
    "matplotlib",
    "dvc",
    "ipykernel",
    "kagglehub",
    "cma",
    "optuna-dashboard",
    "hydra-joblib-launcher",
    "hydra-optuna-sweeper @ git+https://github.com/simplymathematics/hydra-optuna-sweeper.git",
    "optuna>=3",
    "paretoset",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deckard*"]

[project.optional-dependencies]

# -------------------------
# Core research stacks
# -------------------------
lifelines = [
    "lifelines",
]

fairlearn = [
    "fairlearn",
]

anjana = [
    "anjana @ git+https://github.com/IFCA-Advanced-Computing/anjana.git",
    "pycanon",
]

yellowbrick = [
    "yellowbrick",
]

seaborn = [
    "seaborn",
]

torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "cma",
]

# -------------------------
# Documentation stack
# -------------------------
docs = [
    "sphinx",
    "myst-parser",
    "myst-nb",
    "pydata-sphinx-theme>=0.14",  # Modern navigation support
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",

    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-togglebutton",

    "jupyterlab",
    "ipykernel",
    "sphinxcontrib-bibtex",
    "roman",  # Required for Sphinx LaTeX builder
    # NOTE: To run all example notebooks, you must also install the full test stack:
    # pip install -e '.[docs,test]'
    # This ensures torch, anjana, fairlearn, yellowbrick, seaborn, and all ML/plotting libraries are available for notebook execution.
]

# -------------------------
# Development / testing
# -------------------------
test = [
    "pytest",
    "pytest-cov",
    "flake8",
    "black",
    "isort",
    "mypy",
    "pre-commit",
    "pandas",
    "numpy",

    # explicitly include core optional stacks (no composition syntax in TOML)
    "lifelines",
    "fairlearn",
    "anjana @ git+https://github.com/IFCA-Advanced-Computing/anjana.git",
    "pycanon",
    "yellowbrick",
    "seaborn",
    "torchaudio>=2.0.0",
    "cma",
]

# -------------------------
# Lint-only stack
# -------------------------
lint = [
    "flake8",
    "black",
    "isort",
    "mypy",
    "pre-commit",
    "flake8-pyproject",
]
datasets = [
    "datasets"
]
# -------------------------
# Convenience meta-extras
# (fully expanded, no references)
# -------------------------
all = [
    "pandas",
    "scikit-learn",
    "hydra-core",
    "numpy",
    "adversarial-robustness-toolbox",
    "seaborn",
    "yellowbrick",
    "fairlearn",
    "anjana @ git+https://github.com/IFCA-Advanced-Computing/anjana.git",
    "lifelines",
    "matplotlib",
    "dvc",
    "optuna",
    "optuna-dashboard",
    "hydra-joblib-launcher",
    "hydra-optuna-sweeper @ git+https://github.com/simplymathematics/hydra-optuna-sweeper.git",
    "paretoset",
    "ipykernel",
    "kagglehub",
    "cma",

    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
    "myst-parser",
    "nbsphinx",

    "pytest",
    "pytest-cov",
    "flake8",
    "black",
    "isort",
    "mypy",
    "pre-commit",

    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
]
[tool.black]
line-length = 87
target-version = ['py310']
include = 'deckard/.*\.py'

[project.scripts]
deckard = "deckard.__main__:main"

[tool.flake8]
max-line-length = 87
extend-ignore = ["E203", "E501"]
exclude = [
  "__pycache__",
  "*.egg-info",
  ".git",
  ".venv",
  "build",
  "docs"
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
        "ignore::UserWarning",
        "ignore::RuntimeWarning",
        "ignore::sklearn.exceptions.ConvergenceWarning",
        "ignore::DeprecationWarning",
        "ignore::FutureWarning",
        "ignore::matplotlib.MatplotlibDeprecationWarning"
]

[tool.coverage.run]
source = ["deckard"]
omit = [
    "*/__pycache__/*",
    "*/build/*",
    "deckard/optuna_callback.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
